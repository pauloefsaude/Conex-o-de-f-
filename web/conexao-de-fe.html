let writeChain=Promise.resolve();
const write=(fn)=>(writeChain=writeChain.then(fn).catch(e=>{toast(writeError(e));throw e;}));
const writeError=(e)=>e?.code==="quota_exceeded"?"O espaço de dados deste app está cheio. Avise quem administra o app.":e?.code==="invalid_argument"?"Você não tem permissão para salvar aqui. Peça acesso de Colaborador a quem compartilhou o link.":"Não foi possível salvar. Verifique a conexão e tente de novo.";
function toast(msg){const t=document.createElement("div");t.setAttribute("role","status");t.textContent=msg;Object.assign(t.style,{position:"fixed",left:"50%",bottom:"calc(90px + env(safe-area-inset-bottom,0px))",transform:"translateX(-50%)",background:"var(--ink)",color:"var(--bg)",padding:"10px 16px",borderRadius:"12px",zIndex:50,maxWidth:"90vw",fontSize:"14px"});document.body.appendChild(t);setTimeout(()=>t.remove(),3800);}

const blockedPair=(a,b)=>(S.blocks[a]?.ids||[]).includes(b)||(S.blocks[b]?.ids||[]).includes(a);
const suspended=(id)=>(S.mod.suspended||[]).includes(id);
const liked=(a,b)=>(S.likes[a]?.likes||[]).includes(b);
const unmatched=(a,b)=>(S.likes[a]?.unmatched||[]).includes(b)||(S.likes[b]?.unmatched||[]).includes(a);
const isMatch=(o)=>liked(S.me,o)&&liked(o,S.me)&&!unmatched(S.me,o)&&!blockedPair(S.me,o)&&!suspended(o)&&S.profiles[o];
function conversation(o){const mine=(S.outbox[S.me]?.msgs||[]).filter(m=>m.to===o).map(m=>({...m,mine:true}));
 const theirs=(S.outbox[o]?.msgs||[]).filter(m=>m.to===S.me);return [...mine,...theirs].sort((a,b)=>a.ts-b.ts);}

 const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
 S.db=db;S.user=user;
 if(!db||!user){clearTimeout(timer);return renderMain(`<div class="splash"><div><h1>Entre para usar o app</h1><p class="mute">O Conexão de Fé precisa da sua conta Claude para guardar seu perfil e suas conversas. Abra este link estando conectado.</p></div></div>`);}
 S.me=await user.id();S.owner=await user.isOwner();S.canWrite=await user.can("data.write");
 const isAdmin=await user.canEdit();S.admin=isAdmin;
 if(!S.me){clearTimeout(timer);return renderMain(`<div class="splash"><div><h1>Entre para usar o app</h1><p class="mute">Não conseguimos identificar sua conta neste acesso.</p></div></div>`);}
 const coll=(name,key)=>db.collection(name).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());S[key]=m;refresh();},e=>{S.err="Parte dos dados ficou indisponível. Recarregue o app mais tarde.";refresh();});
 coll("profiles","profiles");coll("likes","likes");coll("blocks","blocks");coll("outbox","outbox");
 if(isAdmin)coll("reports","reports");
 db.doc("mod/state").onSnapshot(d=>{S.mod=d.exists?d.data():{suspended:[]};refresh();},()=>{});
 db.doc(`data/users/${S.me}/private`).onSnapshot(d=>{
   S.priv=d.exists?d.data():{};
   if(!S.loaded&&!d.metadata.fromCache){S.loaded=true;clearTimeout(timer);S.view=!S.priv.birthdate?"welcome":!myProfile()?"edit":"discover";render();}
   else refresh();
 },()=>{clearTimeout(timer);renderMain(`<div class="splash"><div><h1>Não foi possível abrir seus dados</h1><p class="mute">Recarregue a página em alguns instantes.</p></div></div>`);});
}

function chipGroup(id,opts,sel,multi,max){const s=multi?(sel||[]):[sel];

document.addEventListener("click",e=>{const c=e.target.closest("[data-group] .chip");if(!c)return;const g=c.parentElement;
 if(g.dataset.multi==="1"){const on=c.getAttribute("aria-pressed")==="true";const max=+g.dataset.max;const count=g.querySelectorAll('[aria-pressed="true"]').length;if(!on&&max&&count>=max)return toast(`Escolha até ${max}.`);c.setAttribute("aria-pressed",String(!on));}
 else{const on=c.getAttribute("aria-pressed")==="true";g.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed",String(!on));}});

 const r=Math.max(W/img.width,H/img.height);const w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72));};img.onerror=rej;img.src=url;});}

function swipe(card,act){let x0=null,dx=0;const like=card.querySelector(".stamp.like"),pass=card.querySelector(".stamp.pass");
 card.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;x0=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.style.transition="none";});
 card.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;like.style.opacity=Math.max(0,dx/110);pass.style.opacity=Math.max(0,-dx/110);});
 const end=()=>{if(x0==null)return;x0=null;const th=card.offsetWidth*.28;if(dx>th)act("like");else if(dx<-th)act("pass");else{card.style.transition="transform .2s";card.style.transform="";like.style.opacity=pass.style.opacity=0;}};
 card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
 card.addEventListener("click",e=>{if(Math.abs(dx)>6){e.stopPropagation();e.preventDefault();}},true);}
async function decide(p,action,example,card){

 try{
  if(action==="like"){const cur=S.likes[S.me]||{likes:[],unmatched:[]};const today=new Date().toDateString();
   const day=cur.day===today?cur.dayCount||0:0;if(day>=50){toast("Você usou suas 50 curtidas de hoje. Volte amanhã com calma.");return render();}
   const next={...cur,likes:[...new Set([...(cur.likes||[]),p.id])],day:today,dayCount:day+1};S.likes[S.me]=next;
   await write(()=>S.db.doc(`likes/${S.me}`).set(next));
   if(liked(p.id,S.me))return matchModal(p.id);
  }else{const passes=[...new Set([...(S.priv.passes||[]),p.id])];S.priv={...S.priv,passes};await write(()=>S.db.doc(`data/users/${S.me}/private`).set(S.priv));}
 }catch{}
 setTimeout(render,200);
}
function matchModal(id){const o=S.profiles[id];const me=myProfile();
 $("#overlay").innerHTML=`<div class="match-bg" role="dialog" aria-label="Combinação"><div style="max-width:360px">
 <svg width="96" height="68" viewBox="0 0 68 48" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="none" stroke="#fff" stroke-width="4"/><circle cx="44" cy="24" r="17" fill="none" stroke="#D8B259" stroke-width="4"/><rect x="32.2" y="14" width="3.6" height="20" rx="1.8" fill="#D8B259"/><rect x="28.5" y="19" width="11" height="3.4" rx="1.7" fill="#D8B259"/></svg>
 <h1>Vocês se curtiram</h1><p style="color:#C9D0E2">Você e ${esc(o.name)} demonstraram interesse um no outro. Que tal começar com uma pergunta gentil?</p>
 <div style="display:flex;justify-content:center;margin:20px 0">${avatar(me,84)}<div style="margin-left:-14px">${avatar(o,84)}</div></div>
 <button class="btn gold" id="mgo">Enviar mensagem</button><button class="btn ghost" id="mx" style="color:#fff;border-color:#4A5B8C">Continuar conhecendo pessoas</button></div></div>`;
 $("#mgo").onclick=()=>{$("#overlay").innerHTML="";go("chat",{chatWith:id});};$("#mx").onclick=()=>{$("#overlay").innerHTML="";render();};}

// ---------- Perfil completo ----------
function vProfile(){const id=S.profileId;const p=S.profileExample||S.profiles[id];
 if(!p||(id!==S.me&&(blockedPair(S.me,id)||suspended(id)))){renderMain(`<p class="mute">Este perfil não está mais disponível.</p><button class="btn" id="bk">Voltar</button>`);$("#bk").onclick=()=>go(S.from||"discover");return;}
 const self=id===S.me;const c=self?{score:null,why:[],shared:[],dist:null}:compat(myProfile(),p);
 $("#topRight").innerHTML=self||S.profileExample?"":`<button class="iconbtn" id="more" aria-label="Denunciar ou bloquear">⋯</button>`;
 renderMain(`<button class="chip" id="bk" style="margin-bottom:12px">‹ Voltar</button>
 ${S.profileExample?'<div class="notice"><span class="example">Exemplo</span> Perfil fictício.</div>':""}
 ${p.photos?.length?`<div style="display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px">${p.photos.map(u=>`<img src="${esc(u)}" alt="" style="width:100%;flex:none;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:start;border-radius:18px">`).join("")}</div>`:`<div class="card" style="position:relative;height:220px"><div class="mono">${esc(initials(p.name))}</div></div>`}
 <h1 style="margin-top:14px">${esc(p.name)}, ${esc(p.age)}</h1><p class="mute">${esc([p.city,band(c.dist)].filter(Boolean).join(" · "))}</p>
 ${self?'<div class="notice">É assim que outras pessoas veem seu perfil.</div>':""}
 ${c.why.length?`<div class="panel" style="background:var(--gold-soft);border-color:var(--gold-soft)"><b>Afinidade declarada: ${c.score}%</b>${c.why.map(w=>`<div>• ${esc(w)}</div>`).join("")}</div>`:""}
 ${p.bio?`<h2>Sobre</h2><p>${esc(p.bio)}</p>`:""}
 <h2>Relacionamento</h2>${p.goal?`<p>Procura: ${esc(p.goal)}</p>`:""}${p.kids?`<p>Filhos: ${esc(p.kids)}</p>`:""}
 ${(p.showDen&&p.denomination)||(p.showPrayer&&p.prayer)||p.verse?"<h2>Fé</h2>":""}
 ${p.showDen&&p.denomination?`<p>Tradição: ${esc(p.denomination)}</p>`:""}${p.showPrayer&&p.prayer?`<p>Oração na rotina: ${"●".repeat(p.prayer)}${"○".repeat(5-p.prayer)}</p>`:""}${p.verse?`<p>Versículo favorito: ${esc(p.verse)}</p>`:""}
 ${p.values?.length?`<h2>Valores</h2><div class="chips">${p.values.map(v=>`<span class="chip static">${esc(v)}</span>`).join("")}</div>`:""}
 ${p.interests?.length?`<h2>Interesses</h2><div class="chips">${p.interests.map(v=>`<span class="chip static ${c.shared.includes(v)?"shared":""}">${esc(v)}</span>`).join("")}</div>`:""}
 ${(p.answers||[]).map(a=>`<div class="panel" style="margin-top:14px"><div class="small mute">${esc(a.q)}</div><div style="font-family:var(--display);font-size:18px;margin-top:4px">${esc(a.a)}</div></div>`).join("")}`);
 $("#bk").onclick=()=>go(S.from||"discover");
 const m=$("#more");if(m)m.onclick=()=>reportSheet(id);
}

// ---------- Conversas ----------
function vChats(){const ids=Object.keys(S.profiles).filter(isMatch);
 const items=ids.map(o=>{const conv=conversation(o);const last=conv[conv.length-1];return {o,last,unread:unreadFrom(o),ts:last?.ts||0};}).sort((a,b)=>b.ts-a.ts);
 renderMain(`<h1>Conversas</h1>${S.err?`<div class="notice warn">${esc(S.err)}</div>`:""}
 ${items.length?items.map(({o,last,unread})=>{const p=S.profiles[o];return `<button class="item" data-o="${esc(o)}">${avatar(p)}<div><div class="t">${esc(p.name)}</div><div class="s">${last?esc((last.mine?"Você: ":"")+last.body):"Nova combinação. Diga olá!"}</div></div>${unread?`<span class="badge">${unread}</span>`:""}</button>`;}).join("")
 :`<div class="panel" style="margin-top:12px"><p>Quando duas pessoas se curtem, a conversa aparece aqui.</p><p class="small mute">Ninguém pode mandar mensagem sem essa curtida mútua.</p></div>`}`);
 document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>go("chat",{chatWith:b.dataset.o}));}

function vChat(){const o=S.chatWith;const p=S.profiles[o];
 if(!isMatch(o)){renderMain(`<div class="notice">Esta conversa foi encerrada.</div><button class="btn" id="bk">Voltar às conversas</button>`);$("#bk").onclick=()=>go("chats");return;}
 $("#topRight").innerHTML=`<button class="iconbtn" id="more" aria-label="Opções da conversa">⋯</button>`;
 renderMain(`<button class="item" id="who" style="padding-top:0">${avatar(p,40)}<div><div class="t">${esc(p.name)}</div><div class="s">Ver perfil</div></div></button>
 <div class="msgs" id="msgs" aria-live="polite"></div>
 <div class="composer"><div><button class="idea" id="idea" aria-label="Ideias de perguntas">✦</button><textarea id="txt" rows="1" maxlength="1000" placeholder="Escreva com carinho…" aria-label="Mensagem"></textarea><button class="send" id="send" aria-label="Enviar">➤</button></div></div>`);
 $("#tabs").hidden=true;
 renderChatMessages();
 $("#who").onclick=()=>go("profile",{profileId:o,profileExample:null,from:"chats"});
 $("#send").onclick=send;$("#txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
 $("#idea").onclick=()=>{const me=myProfile();const shared=(me.interests||[]).filter(i=>(p.interests||[]).includes(i));
  const sugg=[...shared.slice(0,3).map(i=>`Vi que você também gosta de ${i.toLowerCase()}. O que te atraiu nisso?`),...(p.answers||[]).slice(0,2).map(a=>`Gostei da sua resposta sobre "${a.q.replace(/\?$/,"").toLowerCase()}". Pode contar mais?`),...STARTERS.slice(0,4)];
  sheet(`<h2 style="margin-top:0">Ideias para conversar</h2>${shared.length?`<p class="small mute">Em comum: ${esc(shared.join(", "))}</p>`:""}${[...sugg,...QUESTIONS.slice(0,4)].map(q=>`<button class="listrow" data-s="${esc(q)}" style="font-size:15px">${esc(q)}</button>`).join("")}<p class="small mute" style="margin-top:8px">Toque para colocar no campo. Você pode editar antes de enviar.</p>`);
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{$("#txt").value=b.dataset.s;closeSheet();$("#txt").focus();});};
 $("#more").onclick=()=>{sheet(`<button class="btn ghost" id="un">Desfazer combinação</button><button class="btn danger" id="rep">Denunciar ou bloquear</button><button class="btn ghost" data-close>Cancelar</button>`);
  $("#un").onclick=()=>{sheet(`<h2 style="margin-top:0">Desfazer combinação?</h2><p>A conversa será encerrada para os dois.</p><button class="btn danger" id="unok">Desfazer</button><button class="btn ghost" data-close>Cancelar</button>`);
   $("#unok").onclick=async()=>{const cur=S.likes[S.me]||{likes:[]};const next={...cur,unmatched:[...new Set([...(cur.unmatched||[]),o])]};S.likes[S.me]=next;closeSheet();try{await write(()=>S.db.doc(`likes/${S.me}`).set(next));}catch{}go("chats");};};
  $("#rep").onclick=()=>reportSheet(o);};
}
function renderChatMessages(){const box=$("#msgs");if(!box||S.view!=="chat")return;const o=S.chatWith;
 if(!isMatch(o))return render();
 const conv=conversation(o);
 box.innerHTML=conv.length?conv.map(m=>`${!m.mine?(m.f||[]).map(f=>`<div class="alert">⚠ ${esc(WARN[f])}</div>`).join(""):""}<div class="bubble ${m.mine?"mine":"theirs"}" title="${esc(fmtTime(m.ts))}">${esc(m.body)}</div>`).join("")
  :`<div class="panel" style="text-align:center"><p>Comece com respeito e curiosidade.</p><p class="small mute">Toque em ✦ para ver ideias de perguntas.</p></div>`;
 window.scrollTo(0,document.body.scrollHeight);
 const lastTheirs=conv.filter(m=>!m.mine).pop();
 if(lastTheirs&&(S.priv.lastRead?.[o]||0)<lastTheirs.ts){S.priv={...S.priv,lastRead:{...(S.priv.lastRead||{}),[o]:lastTheirs.ts}};write(()=>S.db.doc(`data/users/${S.me}/private`).set(S.priv)).catch(()=>{});}
}
async function send(){const t=$("#txt");const body=t.value.trim();if(!body)return;const o=S.chatWith;
 const mineAll=S.outbox[S.me]?.msgs||[];const recent=mineAll.filter(m=>Date.now()-m.ts<60000);
 if(recent.length>=20)return toast("Muitas mensagens em pouco tempo. Aguarde um minuto.");
 const dupTargets=new Set(mineAll.filter(m=>m.body===body&&m.to!==o&&Date.now()-m.ts<600000).map(m=>m.to));
 if(dupTargets.size>=2)return toast("Parece uma mensagem repetida para várias pessoas. Escreva algo pessoal para esta conversa.");
 const msg={id:Math.random().toString(36).slice(2,10),to:o,body,ts:Date.now(),f:flagsOf(body)};
 const next={msgs:[...mineAll,msg].slice(-400)};S.outbox[S.me]=next;t.value="";renderChatMessages();
 try{await write(()=>S.db.doc(`outbox/${S.me}`).set(next));}catch{t.value=body;}}

// ---------- Denúncia e bloqueio ----------
function reportSheet(id){const p=S.profiles[id];const theirs=conversation(id).filter(m=>!m.mine).slice(-5);
 sheet(`<h2 style="margin-top:0">Denunciar ${esc(p?.name||"")}</h2><p class="small mute">A pessoa não saberá quem denunciou. Em perigo, ligue 190. Violência contra a mulher: 180.</p>
 <label class="label" for="rr">Motivo</label><select class="input" id="rr"><option value="">Escolha</option>${REASONS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select>
 ${theirs.length?`<label class="label" for="rm">Mensagem (opcional)</label><select class="input" id="rm"><option value="">Nenhuma</option>${theirs.map(m=>`<option value="${esc(m.id)}">${esc(m.body.slice(0,60))}</option>`).join("")}</select>`:""}
 <label class="label" for="rd">Detalhes (opcional)</label><textarea class="input" id="rd" maxlength="1000"></textarea>
 <label class="check"><input type="checkbox" id="rb" checked><span>Também bloquear esta pessoa</span></label>
 <div class="err" id="rerr"></div><button class="btn danger" id="rsend">Enviar denúncia</button><button class="btn ghost" id="bonly">Só bloquear</button><button class="btn ghost" data-close>Cancelar</button>`);
 $("#rsend").onclick=async()=>{const reason=$("#rr").value;if(!reason)return $("#rerr").textContent="Escolha um motivo.";
  const mid=$("#rm")?.value;const snap=mid?theirs.find(m=>m.id===mid)?.body:null;
  try{const ref=S.db.doc(`reports/${S.me}`);const cur=await ref.get();const items=(cur.exists?cur.data().items:[])||[];
   await write(()=>ref.set({items:[...items,{target:id,reason,details:$("#rd").value.trim().slice(0,1000),snapshot:snap,ts:Date.now(),status:"open"}].slice(-100)}));
   if($("#rb").checked)await block(id);closeSheet();toast("Denúncia enviada. Obrigado por nos avisar.");go($("#rb")?.checked?"chats":S.view);}catch{}};
 $("#bonly").onclick=async()=>{try{await block(id);closeSheet();toast("Pessoa bloqueada.");go("chats");}catch{}};}
async function block(id){const cur=S.blocks[S.me]||{ids:[]};const next={ids:[...new Set([...(cur.ids||[]),id])]};S.blocks[S.me]=next;await write(()=>S.db.doc(`blocks/${S.me}`).set(next));}

function sheet(html){$("#overlay").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog">${html}</div></div>`;
 $("#sbg").addEventListener("click",e=>{if(e.target.id==="sbg"||e.target.closest("[data-close]"))closeSheet();});}
function closeSheet(){$("#overlay").innerHTML="";}

// ---------- Inspiração ----------
function vInsp(){renderMain(`<h1>Inspiração</h1><p class="mute">Reflexões para o caminho. Não prometem resultados espirituais ou amorosos.</p>
 ${INSPIRATION.map(([k,t,r,b])=>`<div class="panel"><div class="kicker">${esc(k)}</div><div style="font-family:var(--display);font-size:20px;margin-top:4px">${esc(t)}</div>${r?`<div class="mute" style="font-style:italic">${esc(r)}</div>`:""}<p style="margin-top:8px">${esc(b)}</p></div>`).join("")}`);}

// ---------- Perfil / conta ----------
function vMe(){const p=myProfile()||{};
 renderMain(`<div style="display:flex;align-items:center;gap:14px;margin:6px 0 10px">${avatar(p,72)}<div><h1 style="margin:0">${esc(p.name)}</h1><div class="mute">${esc(p.city||"")}</div></div></div>
 <button class="listrow" data-v="edit">Editar perfil e fotos <span>›</span></button>
 <button class="listrow" data-v="preview">Ver meu perfil como os outros veem <span>›</span></button>
 <button class="listrow" data-v="privacy">Privacidade <span>›</span></button>
 <button class="listrow" data-v="blocked">Pessoas bloqueadas <span>›</span></button>
 <button class="listrow" data-v="help">Central de ajuda <span>›</span></button>
 <button class="listrow danger" data-v="delete">Excluir conta e dados <span>›</span></button>`);
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==="preview")go("profile",{profileId:S.me,profileExample:null,from:"me"});else if(v==="help")helpSheet();else go(v);});}
function helpSheet(){const faq=[["Como funciona uma combinação?","Quando duas pessoas se curtem, a conversa abre para as duas. Sem curtida mútua, ninguém consegue mandar mensagem."],
 ["Quem vê minha denominação?","Só quem você permitir. Por padrão ela fica oculta; mude em Editar perfil ou Privacidade."],
 ["Como a afinidade é calculada?","Somamos pontos por objetivo, interesses e valores em comum, planos sobre filhos e distância. Mostramos os motivos de cada sugestão."],
 ["Alguém pediu dinheiro. O que faço?","Não envie. Abra a conversa, toque em ⋯ e escolha Denunciar ou bloquear."],
 ["Minhas mensagens são privadas?","Nesta versão de testes, as mensagens ficam guardadas no espaço compartilhado do app. Não envie dados pessoais sensíveis, como documentos ou endereço."],
 ["Como excluo minha conta?","Em Perfil, Excluir conta e dados. Apagamos perfil, fotos, curtidas, bloqueios e mensagens enviadas."]];
 sheet(`<h2 style="margin-top:0">Central de ajuda</h2>${faq.map(([q,a])=>`<details style="border-bottom:1px solid var(--line);padding:10px 0"><summary style="cursor:pointer;font-weight:700">${esc(q)}</summary><p style="margin-top:6px">${esc(a)}</p></details>`).join("")}<button class="btn" data-close>Fechar</button>`);}
function vPrivacy(){const p=myProfile();
 renderMain(`<button class="chip" id="bk" style="margin-bottom:12px">‹ Voltar</button><h1>Privacidade</h1>
 <label class="check"><input type="checkbox" id="hid" ${p.hidden?"":"checked"}><span>Aparecer para novas pessoas<br><span class="small mute">Desligado, você some da descoberta e mantém suas conversas.</span></span></label>
 <label class="check"><input type="checkbox" id="sd" ${p.showDen?"checked":""}><span>Mostrar minha denominação</span></label>
 <label class="check"><input type="checkbox" id="sp" ${p.showPrayer?"checked":""}><span>Mostrar a importância da oração</span></label>
 <p class="small mute" style="margin-top:10px">Nunca mostramos sua data de nascimento nem sua localização exata. Pessoas que você passou ficam guardadas só para você.</p>
 <button class="btn" id="save">Salvar</button>`);
 $("#bk").onclick=()=>go("me");
 $("#save").onclick=async()=>{const next={...p,hidden:!$("#hid").checked,showDen:$("#sd").checked,showPrayer:$("#sp").checked,updatedAt:Date.now()};try{await write(()=>S.db.doc(`profiles/${S.me}`).set(next));S.profiles[S.me]=next;toast("Privacidade salva.");go("me");}catch{}};}
function vBlocked(){const ids=S.blocks[S.me]?.ids||[];
 renderMain(`<button class="chip" id="bk" style="margin-bottom:12px">‹ Voltar</button><h1>Bloqueados</h1>${ids.length?ids.map(id=>`<div class="listrow" style="cursor:default"><span>${esc(S.profiles[id]?.name||"Conta removida")}</span><button class="chip" data-ub="${esc(id)}">Desbloquear</button></div>`).join(""):'<p class="mute">Você não bloqueou ninguém.</p>'}`);
 $("#bk").onclick=()=>go("me");
 document.querySelectorAll("[data-ub]").forEach(b=>b.onclick=async()=>{const next={ids:ids.filter(x=>x!==b.dataset.ub)};S.blocks[S.me]=next;try{await write(()=>S.db.doc(`blocks/${S.me}`).set(next));}catch{}render();});}
function vDelete(){renderMain(`<button class="chip" id="bk" style="margin-bottom:12px">‹ Voltar</button><h1>Excluir conta e dados</h1>
 <p>Vamos apagar seu perfil, fotos, curtidas, bloqueios, mensagens enviadas e seus dados privados.</p><p class="small mute">Denúncias que você enviou ficam com a moderação para proteger outras pessoas.</p>
 <label class="label" for="cf">Digite EXCLUIR para confirmar</label><input class="input" id="cf" autocomplete="off"><button class="btn danger" id="del" disabled>Excluir definitivamente</button>`);
 $("#bk").onclick=()=>go("me");$("#cf").oninput=e=>$("#del").disabled=e.target.value.trim().toUpperCase()!=="EXCLUIR";
 $("#del").onclick=async()=>{$("#del").disabled=true;try{for(const p of [`profiles/${S.me}`,`likes/${S.me}`,`blocks/${S.me}`,`outbox/${S.me}`,`data/users/${S.me}/private`])await write(()=>S.db.doc(p).delete());
  delete S.profiles[S.me];S.priv={};renderMain(`<div class="splash"><div><h1>Conta excluída</h1><p class="mute">Seus dados foram apagados. Que Deus abençoe seu caminho.</p></div></div>`);$("#tabs").hidden=true;}catch{$("#del").disabled=false;}};}
function vSuspended(){$("#tabs").hidden=true;renderMain(`<div class="splash"><div><h1>Conta suspensa</h1><p class="mute">Sua conta foi suspensa pela moderação após análise de denúncias. Se acha que houve engano, fale com quem administra este app.</p></div></div>`);}

// ---------- Moderação (dono e editores) ----------
function vMod(){if(!S.admin)return go("discover");
 const profiles=Object.keys(S.profiles).length;const likeIds=Object.keys(S.likes);
 let matches=0;likeIds.forEach(a=>(S.likes[a].likes||[]).forEach(b=>{if(a<b&&liked(b,a))matches++;}));
 const msgs=Object.values(S.outbox).reduce((n,o)=>n+(o.msgs||[]).length,0);
 const flagged=Object.values(S.outbox).reduce((n,o)=>n+(o.msgs||[]).filter(m=>m.f?.length).length,0);
 const reports=Object.entries(S.reports).flatMap(([by,d])=>(d.items||[]).map(r=>({...r,by}))).sort((a,b)=>b.ts-a.ts);
 const susp=S.mod.suspended||[];
 renderMain(`<h1>Moderação</h1><div class="stat"><div><span class="small mute">Perfis</span><b>${profiles}</b></div><div><span class="small mute">Combinações</span><b>${matches}</b></div><div><span class="small mute">Mensagens</span><b>${msgs}</b></div><div><span class="small mute">Mensagens com alerta</span><b>${flagged}</b></div></div>
 <h2>Denúncias (${reports.length})</h2><p class="small mute">Você vê apenas o trecho denunciado, não a conversa inteira.</p>
 ${reports.length?reports.map(r=>{const t=S.profiles[r.target];const s=susp.includes(r.target);return `<div class="panel"><div class="kicker">${esc(REASONS.find(x=>x[0]===r.reason)?.[1]||r.reason)}</div>
  <div style="font-weight:700;margin-top:4px">${esc(t?.name||"Conta removida")} ${s?'<span class="badge" style="background:var(--danger);color:#fff">suspensa</span>':""}</div><div class="small mute">${esc(fmtTime(r.ts))}</div>
  ${r.snapshot?`<div class="notice" style="margin:8px 0">“${esc(r.snapshot)}”</div>`:""}${r.details?`<p>${esc(r.details)}</p>`:""}
  ${t?`<button class="btn ${s?"ghost":"danger"}" data-sus="${esc(r.target)}" data-on="${s?0:1}">${s?"Reativar conta":"Suspender conta"}</button>`:""}</div>`;}).join(""):'<p class="mute">Nenhuma denúncia por enquanto.</p>'}`);
 document.querySelectorAll("[data-sus]").forEach(b=>b.onclick=async()=>{const id=b.dataset.sus;const next={suspended:b.dataset.on==="1"?[...new Set([...susp,id])]:susp.filter(x=>x!==id)};S.mod=next;try{await write(()=>S.db.doc("mod/state").set(next));toast(b.dataset.on==="1"?"Conta suspensa.":"Conta reativada.");}catch{}render();});}

boot();
})();
</script>
